<?xml version="1.0" encoding="utf-8"?>
<!-- launcher icon, on one of the base shapes of the Sailfish app icon guide (the fully rounded one, a circle; greyscale):
     86 px, no padding but a 0.3 px gap on each side. the png files of each size are drawn from it
     by scripts/make-icons.py -->
<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86">
  <defs>
    <linearGradient id="background" gradientUnits="userSpaceOnUse" x1="8" y1="78" x2="78" y2="8">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>
  <circle fill="url(#background)" cx="43" cy="43" r="42.7"/>
  <!-- a tree of items: one on top, two under it -->
  <path fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M27 33 V60 H38 M27 44 H38"/>
  <rect fill="#ffffff" x="20" y="22" width="26" height="9" rx="4.5"/>
  <rect fill="#ffffff" fill-opacity="0.9" x="40" y="39.5" width="26" height="9" rx="4.5"/>
  <rect fill="#ffffff" fill-opacity="0.9" x="40" y="55.5" width="26" height="9" rx="4.5"/>
</svg>
